<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsPsych Red Circle Experiment</title>
    
    <!-- jsPsych 7系 コアライブラリとCSSの読み込み -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        /* 仕様1: 背景色は灰色 (#808080) */
        /* jsPsychの表示領域全体を灰色に塗りつぶす */
        html, body, .jspsych-display-element {
            background-color: #808080;
            color: white;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* 仕様2: 直径100pxの赤い円 */
        .red-circle {
            width: 100px;
            height: 100px;
            background-color: #ff0000;
            border-radius: 50%;
            margin: 0 auto;
            display: block;
        }

        .instruction {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <script>
        
        // jsPsychの初期化
        const jsPsych = initJsPsych({
            on_finish: function() {
                // 必要に応じてデータ保存処理などを記述
            }
        });

        // 試行の定義
        const trial = {
            // html-keyboard-responseプラグインを使用
            type: jsPsychHtmlKeyboardResponse,
            // 仕様2: 中央に赤い円を描画 (DIVとCSS)
            stimulus: `
                <div class="red-circle"></div>
                <p class="instruction">スペースキーを押してください</p>
            `,
            // 仕様3: スペースキーが押されるまで表示
            choices: [' '], 
            data: { task: 'circle_presentation' }
        };

        // 仕様4: 終了メッセージ
        const end_message = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<p class="instruction">終了しました。</p>',
            choices: "NO_KEYS",
            trial_duration: 3000 // 3秒後に終了
        };

        
        // タイムラインの実行
        // ブラウザの仕様上、一度画面をクリックしてからキーを押すと確実です
        jsPsych.run([trial, end_message]);
    </script>
</body>
</html>
