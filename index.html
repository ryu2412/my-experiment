<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsPsych Circle Experiment - Fixed</title>
    <!-- jsPsych v7 核心ライブラリ -->
    <script src="https://unpkg.com/jspsych@7.3.4"></script>
    <!-- html-keyboard-response プラグイン -->
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
    <!-- 標準CSS -->
    <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* jsPsych全体の背景色を灰色に固定 */
        html, body, .jspsych-display-element {
            background-color: #808080 !important;
            color: white;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* 赤い円のスタイル定義 */
        .red-circle {
            width: 100px;
            height: 100px;
            background-color: #ff0000;
            border-radius: 50%;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* テキストのスタイル */
        .instruction {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <script>
        
        // jsPsychの初期化（display_elementを省略してbody全体を使用）
        const jsPsych = initJsPsych({
            on_finish: function() {
                // 必要に応じて終了時の処理をここに記述
            }
        });

        // 1. 赤い円を表示するトライアル
        const circleTrial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction">
                    <div class="red-circle"></div>
                    <p>スペースキーを押すと終了します</p>
                </div>
            `,
            choices: [' '], // スペースキーのみ反応
            post_trial_gap: 500
        };

        // 2. 終了メッセージ
        const endMessage = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction">
                    <h2 style="font-size: 28px;">実験が終了しました</h2>
                    <p>ウィンドウを閉じてください</p>
                </div>
            `,
            choices: "NO_KEYS", // キー入力を受け付けない
            trial_duration: 5000 // 5秒間表示
        };

        // タイムラインの構築
        const timeline = [circleTrial, endMessage];

        window.onload = function() {
            // 実行
            jsPsych.run(timeline);
            // キー入力を受け取れるよう、自動的にウィンドウにフォーカスを当てる
            window.focus();
        };
    </script>
</body>
</html>
