<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Task - jsPsych</title>
    <!-- jsPsych 7.3系のコアライブラリと必要なプラグインをCDNから読み込みます -->
    <script src="https://unpkg.com/jspsych@7.3.0"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <!-- 全画面プラグインの読み込みを削除または維持（今回はエラー回避のため使用しません） -->
    <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css">
    
    <style>
        /* 背景色、フォント、文字サイズの設定 */
        body {
            background-color: #FFFFFF;
            color: #333;
            font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* 刺激（ストループ文字）のスタイル */
        .stroop-stimulus {
            font-size: 60px;
            font-weight: bold;
        }

        /* 教示画面のスタイル */
        .instruction-text {
            font-size: 24px;
            line-height: 1.6;
            text-align: left;
            display: inline-block;
        }

        /* 注視点のスタイル */
        .fixation {
            font-size: 60px;
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>

    <script>
        const jsPsych = initJsPsych({
            on_finish: function() {
                // 実験終了時にCSV形式でデータを表示
                jsPsych.data.displayData('csv');
            }
        });

        // 要因計画: 文字(赤,青,緑) × 色(red, blue, green)
        const words = [
            { text: "赤", color_name: "red", key: "r" },
            { text: "青", color_name: "blue", key: "b" },
            { text: "緑", color_name: "green", key: "g" }
        ];

        const colors = [
            { name: "red", hex: "#FF0000", key: "r" },
            { name: "blue", hex: "#0000FF", key: "b" },
            { name: "green", hex: "#008000", key: "g" }
        ];

        let stimuli = [];

        // 全ての組み合わせを生成
        words.forEach(w => {
            colors.forEach(c => {
                stimuli.push({
                    stimulus_text: w.text,
                    stimulus_color: c.hex,
                    correct_key: c.key,
                    condition: (w.color_name === c.name) ? "congruent" : "incongruent"
                });
            });
        });

        const timeline = [];

        // エラーの原因となる全画面化（jsPsychFullscreen）をタイムラインから除外します。
        // 代わりに、開始を確認する画面を最初に入れます。

        // (1) 教示画面（開始画面）
        const instructions = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
                <div class="instruction-text">
                    <p>文字の「色」をキーボードで答えてください。</p>
                    <p>赤色なら <strong style="color:red">'r'</strong></p>
                    <p>青色なら <strong style="color:blue">'b'</strong></p>
                    <p>緑色なら <strong style="color:green">'g'</strong></p>
                    <br>
                    <p>スペースキーで開始します。</p>
                </div>
            `,
            choices: [' '],
            post_trial_gap: 500
        };
        timeline.push(instructions);

        // (3) メイン試行ループの定義
        
        // 注視点
        const fixation = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '<div class="fixation">+</div>',
            choices: "NO_KEYS",
            trial_duration: 500
        };

        // 刺激提示
        const trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: function() {
                const s = jsPsych.timelineVariable('stimulus_text');
                const c = jsPsych.timelineVariable('stimulus_color');
                return `<div class="stroop-stimulus" style="color: ${c};">${s}</div>`;
            },
            choices: ['r', 'g', 'b'],
            data: {
                task: 'response',
                correct_response: jsPsych.timelineVariable('correct_key'),
                condition: jsPsych.timelineVariable('condition')
            },
            on_finish: function(data) {
                // 正誤判定
                data.correct = jsPsych.pluginAPI.compareKeys(data.response, data.correct_response);
            }
        };

        // 試行間隔 (ITI)
        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: '',
            choices: "NO_KEYS",
            trial_duration: 1000
        };

        // ループ構造の作成 (10試行をランダムに抽出)
        const test_procedure = {
            timeline: [fixation, trial, iti],
            timeline_variables: stimuli,
            sample: {
                type: 'with-replacement',
                size: 10
            }
        };
        timeline.push(test_procedure);

        jsPsych.run(timeline);

    </script>
</body>
</html>
