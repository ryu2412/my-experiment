<!DOCTYPE html>
<html>
<head>
  <title>jsPsych Red Circle Task</title>
  <!-- Load jsPsych v7 from CDN -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <!-- Load html-keyboard-response plugin -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  
  <style>
    /* 1. Background color set to gray (#808080) */
    body {
      background-color: #808080;
      color: white; /* Ensure text is readable on gray background */
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 2. Red circle styles (100px diameter) */
    .red-circle {
      height: 100px;
      width: 100px;
      background-color: #ff0000;
      border-radius: 50%;
      margin: 0 auto;
    }

    /* Override jsPsych stimulus style if needed */
    .jspsych-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>
</body>
<script>
  // Initialize jsPsych
  const jsPsych = initJsPsych({
    display_element: 'jspsych-target',
    on_finish: function() {
      // display raw data for debugging
      console.log("Task Finished");
    }
  });

  const timeline = [];

  // 3. Trial to display the red circle until spacebar is pressed
  const circleTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="red-circle"></div>',
    choices: [' '], // Spacebar only
    prompt: `
      <div style="margin-top: 20px; font-family: sans-serif;">
        スペースキーを押すと終了します
      </div>
    `,
    response_ends_trial: true
  };
  timeline.push(circleTrial);

  // 4. Finish message
  const finishMessage = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div style="font-family: sans-serif;">
        <h1>終了しました</h1>
        <p>ご協力ありがとうございました。</p>
      </div>
    `,
    choices: "NO_KEYS", // Prevent further interaction
    trial_duration: 3000 // Show message for 3 seconds
  };
  timeline.push(finishMessage);

  // Start the experiment
  jsPsych.run(timeline);
</script>
</html>
