<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1-Back & 2-Back 認知課題実験</title>
  
  <!-- jsPsych 7.3.0 core files from CDN -->
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" type="text/css" />
  
  <!-- jsPsych Plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.2"></script>

  <!-- Tailwind CSS for Modern UI -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* 全体のフォントを読みやすいゴシック体に統一 */
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.8;
    }
    .jspsych-content {
      max-width: 800px;
      width: 90%;
    }
    /* 教示文などの文字サイズ調整 */
    .instruction-text {
      font-size: 1.20rem;
      text-align: left;
      margin-bottom: 1.5rem;
    }
    /* 刺激アルファベットの表示スタイル */
    .stimulus-display {
      font-size: 100px;
      font-weight: 700;
      color: #0f172a;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    /* レスポンシブ対応の押しやすいボタン */
    .custom-btn {
      padding: 1rem 2rem;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 0.75rem;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    .custom-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="jspsych-target"></div>

  <script>
    // --- 1. グローバル設定と変数 ---
    const LETTERS = ['A', 'B', 'C', 'D', 'E'];
    const TOTAL_TRIALS = 20;
    const TARGET_COUNT = 6;      // 直前と同じ（ターゲット）の数
    const NONTARGET_COUNT = 14;  // 直前と異なる（非ターゲット）の数

    let participantInfo = {};    // 参加者情報を格納するオブジェクト

    // 送信先のGoogle Apps Script (GAS) ウェブアプリURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbw4wD8_GsI2MsGQ6XBI-wMzwF91AKmJG2ikg3IbvDe0OrZApItQ1Qpw4kCxtejuhC_zuQ/exec';

    // --- 2. 1-Back刺激配列の生成アルゴリズム (厳密にターゲット6回、非ターゲット14回) ---
    function generate1BackSequence() {
      let sequence = [];
      let conditions = []; // 各試行が "target" か "nontarget" かを記録

      // 最初の試行は必ず non-target
      conditions.push("nontarget");

      // 残り19試行の中に、targetを6個、nontargetを13個割り振る
      let remainingConditions = [];
      for (let i = 0; i < TARGET_COUNT; i++) {
        remainingConditions.push("target");
      }
      for (let i = 0; i < (NONTARGET_COUNT - 1); i++) {
        remainingConditions.push("nontarget");
      }

      // フィッシャー・イェーツのシャッフルで残りの条件順序をランダム化
      for (let i = remainingConditions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingConditions[i], remainingConditions[j]] = [remainingConditions[j], remainingConditions[i]];
      }

      // 条件配列を合体させる
      conditions = conditions.concat(remainingConditions);

      // 1試行目：ランダムに1文字選択
      sequence.push(LETTERS[Math.floor(Math.random() * LETTERS.length)]);

      for (let i = 1; i < TOTAL_TRIALS; i++) {
        let prevLetter = sequence[i - 1];
        if (conditions[i] === "target") {
          sequence.push(prevLetter);
        } else {
          let availableLetters = LETTERS.filter(l => l !== prevLetter);
          let chosen = availableLetters[Math.floor(Math.random() * availableLetters.length)];
          sequence.push(chosen);
        }
      }

      return sequence.map((letter, index) => {
        return {
          trial_index: index + 1,
          letter: letter,
          target_condition: conditions[index] === "target" ? "同じ" : "違う"
        };
      });
    }

    // --- 3. 2-Back刺激配列の生成アルゴリズム (厳密にターゲット6回、非ターゲット14回) ---
    function generate2BackSequence() {
      let sequence = [];
      let conditions = []; // 各試行が "target"（2つ前と同じ）か "nontarget" かを記録

      // 最初の2試行は比較対象となる2つ前がないため必ず non-target
      conditions.push("nontarget");
      conditions.push("nontarget");

      // 残り18試行の中に、targetを6個、nontargetを12個割り振る
      let remainingConditions = [];
      for (let i = 0; i < TARGET_COUNT; i++) {
        remainingConditions.push("target");
      }
      for (let i = 0; i < (NONTARGET_COUNT - 2); i++) {
        remainingConditions.push("nontarget");
      }

      // シャッフル
      for (let i = remainingConditions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [remainingConditions[i], remainingConditions[j]] = [remainingConditions[j], remainingConditions[i]];
      }

      // 条件配列を合体
      conditions = conditions.concat(remainingConditions);

      // 1試行目：ランダム選択
      sequence.push(LETTERS[Math.floor(Math.random() * LETTERS.length)]);
      
      // 2試行目：1試行目とは異なるランダムな文字を選択
      let availableLetters1 = LETTERS.filter(l => l !== sequence[0]);
      sequence.push(availableLetters1[Math.floor(Math.random() * availableLetters1.length)]);

      // 3試行目以降
      for (let i = 2; i < TOTAL_TRIALS; i++) {
        let twoPrevLetter = sequence[i - 2];
        if (conditions[i] === "target") {
          // ターゲット試行：2つ前と同じ文字にする
          sequence.push(twoPrevLetter);
        } else {
          // 非ターゲット試行：2つ前と異なる文字にする
          // (直前と同じ文字を極力避けて自然な遷移にするため、直前および2つ前と異なる文字から選ぶ)
          let prevLetter = sequence[i - 1];
          let availableLetters = LETTERS.filter(l => l !== twoPrevLetter && l !== prevLetter);
          // もし選択肢が空になる場合は、2つ前とだけ異なる文字から選ぶ
          if (availableLetters.length === 0) {
            availableLetters = LETTERS.filter(l => l !== twoPrevLetter);
          }
          let chosen = availableLetters[Math.floor(Math.random() * availableLetters.length)];
          sequence.push(chosen);
        }
      }

      return sequence.map((letter, index) => {
        return {
          trial_index: index + 1,
          letter: letter,
          target_condition: conditions[index] === "target" ? "同じ" : "違う"
        };
      });
    }

    // 刺激シーケンスの作成
    const stimulusSequence1Back = generate1BackSequence();
    const stimulusSequence2Back = generate2BackSequence();

    // --- 4. jsPsych の初期化 ---
    const jsPsych = initJsPsych({
      display_element: 'jspsych-target',
      on_finish: function() {
        // 全試行（1-Back & 2-Back）からキー反応（html-keyboard-response）データのみを抽出
        const trialsData = jsPsych.data.get().filter({trial_type: 'html-keyboard-response'}).values();
        
        // 不要なデータ行を除外した、分析に必要な軽量版データ配列を作成
        const cleanTrials = trialsData.map(d => ({
          trial_num: d.trial_num,
          nback_type: d.nback_type,
          stimulus_letter: d.stimulus_letter,
          target_condition: d.target_condition,
          participant_response: d.participant_response,
          correct: d.correct,
          rt: d.rt
        }));

        // 送信用データオブジェクトの構築
        const postData = {
          participant_id: participantInfo.participant_id || "不明",
          age: participantInfo.age || "不明",
          gender: participantInfo.gender || "不明",
          timestamp: new Date().toISOString(),
          trials: cleanTrials
        };

        // 画面を「送信中」ステータスに書き換え
        const displayElement = jsPsych.getDisplayElement();
        displayElement.innerHTML = `
          <div class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6">
            <div class="bg-white p-8 md:p-12 rounded-3xl shadow-sm border border-slate-200 text-center max-w-md w-full space-y-6">
              <div class="flex justify-center">
                <svg class="animate-spin h-12 w-12 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
              </div>
              <div>
                <h3 class="text-xl font-bold text-slate-800">データを送信中です...</h3>
                <p class="text-sm text-slate-500 mt-2">ブラウザを閉じずにそのまま少々お待ちください。</p>
              </div>
            </div>
          </div>
        `;

        // fetch で GAS URL に POST 送信 (mode: 'no-cors' 指定)
        fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(postData)
        })
        .then(() => {
          // 送信成功時：メッセージを渡して結果フィードバック画面を表示
          displayFeedbackTable(true);
        })
        .catch((error) => {
          console.error('Data transmission failed:', error);
          // 万が一失敗した場合でもデータを保護するため、エラー警告付きでテーブルを表示
          displayFeedbackTable(false);
        });
      }
    });

    const timeline = [];

    // --- 5. 参加者情報入力画面（Survey HTML Form） ---
    const participant_info_trial = {
      type: jsPsychSurveyHtmlForm,
      html: `
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-left max-w-md mx-auto my-8">
          <h2 class="text-2xl font-bold mb-6 text-slate-800 border-b pb-3 text-center">参加者情報の入力</h2>
          <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-600 mb-2" for="participant_id">参加者ID <span class="text-red-500">*</span></label>
            <input type="text" id="participant_id" name="participant_id" required 
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
              placeholder="例: SUB001">
          </div>
          <div class="mb-5">
            <label class="block text-sm font-semibold text-slate-600 mb-2" for="age">年齢 <span class="text-red-500">*</span></label>
            <input type="number" id="age" name="age" min="0" max="120" required 
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
              placeholder="例: 20">
          </div>
          <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-600 mb-2" for="gender">性別 <span class="text-red-500">*</span></label>
            <select id="gender" name="gender" required 
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all">
              <option value="" disabled selected>選択してください</option>
              <option value="男性">男性</option>
              <option value="女性">女性</option>
              <option value="その他">その他 / 回答しない</option>
            </select>
          </div>
          <p class="text-xs text-slate-400 mb-6 text-center">※ すべて必須入力項目です。</p>
        </div>
      `,
      button_label: '実験の説明へ進む',
      css_classes: ['custom-form-container'],
      on_finish: function(data) {
        participantInfo = data.response;
        jsPsych.data.addProperties({
          participant_id: participantInfo.participant_id,
          age: participantInfo.age,
          gender: participantInfo.gender
        });
      }
    };
    timeline.push(participant_info_trial);

    // --- 6. 1-Back教示画面 ---
    const instructions1Back = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-left max-w-2xl mx-auto my-8">
          <h2 class="text-3xl font-bold text-center text-slate-800 mb-6">【前半】1-Backテストの説明</h2>
          
          <div class="instruction-text space-y-4 text-slate-700">
            <p>この実験は前半と後半に分かれています。まずは前半の<strong>「1-Backテスト」</strong>を行います。</p>
            <p>画面の真ん中にアルファベット（A, B, C, D, E）が1文字ずつ、順番に表示されます。</p>
            <p>あなたの課題は、<strong>「今表示された文字」が「1つ前に表示された文字」と【同じ】か【違う】か</strong>を判断することです。</p>
            
            <div class="bg-slate-50 p-4 rounded-lg border-l-4 border-indigo-500 space-y-2 text-sm">
              <p class="font-bold text-slate-800">例（文字の並びが A → B → B と進んだ場合）</p>
              <ul class="list-disc pl-5 space-y-1 text-slate-600">
                <li>1文字目の <strong>A</strong> : 最初なので「違う」を選択してください。</li>
                <li>2文字目の <strong>B</strong> : 1つ前は「A」なので、答えは <span class="text-blue-600 font-bold">「違う」</span> です。</li>
                <li>3文字目の <strong>B</strong> : 1つ前は「B」なので、答えは <span class="text-red-600 font-bold">「同じ」</span> です。</li>
              </ul>
            </div>

            <p class="font-semibold text-slate-800 pt-2 text-center text-md">回答方法</p>
            <div class="grid grid-cols-2 gap-4 text-center text-sm">
              <div class="p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                <p class="font-bold text-indigo-700">スマートフォン / タブレット</p>
                <p class="text-slate-600">画面に表示される大きな「同じ」「違う」ボタンを直接タップしてください。</p>
              </div>
              <div class="p-3 bg-indigo-50 rounded-lg border border-indigo-100">
                <p class="font-bold text-indigo-700">パソコン (キーボード)</p>
                <p class="text-slate-600">キーボードのキーでも回答できます。<br><strong>[F] キー ＝「同じ」</strong><br><strong>[J] キー ＝「違う」</strong></p>
              </div>
            </div>
          </div>
          <p class="text-center text-red-500 font-semibold mb-4 text-sm">※ 文字が表示されている時間は 0.5秒間 と短いため、集中して挑戦してください！</p>
        </div>
      `,
      choices: ['準備ができたら【前半】を開始する'],
      button_html: '<button class="custom-btn w-full bg-indigo-600 hover:bg-indigo-700 text-white">%choice%</button>'
    };
    timeline.push(instructions1Back);

    // --- 7. 1-Back課題ループの構築 ---
    stimulusSequence1Back.forEach((trialInfo) => {
      const trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
          return `
            <div class="flex flex-col justify-between h-[80vh] py-8 select-none">
              <div class="text-center text-slate-400 font-medium text-sm md:text-base space-y-1">
                <div class="text-indigo-500 font-bold">【前半：1つ前の文字と同じ？】</div>
                <div>同じなら「同じ」、違えば「違う」を選択してください。</div>
                <div class="hidden md:block">（パソコン：[F]キー ＝ 同じ / [J]キー ＝ 違う）</div>
              </div>
              
              <div id="stimulus-container" class="stimulus-display">
                ${trialInfo.letter}
              </div>
              
              <div class="flex justify-center gap-6 max-w-md mx-auto w-full px-4">
                <button id="btn-same" class="flex-1 py-4 bg-emerald-600 text-white font-bold text-xl rounded-2xl active:scale-95 shadow-md active:bg-emerald-700 transition-all">
                  同じ (F)
                </button>
                <button id="btn-diff" class="flex-1 py-4 bg-rose-600 text-white font-bold text-xl rounded-2xl active:scale-95 shadow-md active:bg-rose-700 transition-all">
                  違う (J)
                </button>
              </div>
            </div>
          `;
        },
        choices: ['f', 'j'],
        stimulus_duration: 500,
        trial_duration: 2000,
        response_ends_trial: false,
        on_load: function() {
          const btnSame = document.getElementById('btn-same');
          const btnDiff = document.getElementById('btn-diff');
          
          function handleButtonResponse(key) {
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
            if (key === 'f') {
              btnSame.classList.add('ring-4', 'ring-emerald-300', 'bg-emerald-700');
            } else if (key === 'j') {
              btnDiff.classList.add('ring-4', 'ring-rose-300', 'bg-rose-700');
            }
          }
          
          btnSame.addEventListener('click', () => handleButtonResponse('f'));
          btnDiff.addEventListener('click', () => handleButtonResponse('j'));
          btnSame.addEventListener('touchstart', (e) => { e.preventDefault(); handleButtonResponse('f'); });
          btnDiff.addEventListener('touchstart', (e) => { e.preventDefault(); handleButtonResponse('j'); });
        },
        on_finish: function(data) {
          let correct_key = null;
          if (trialInfo.trial_index === 1) {
            correct_key = 'j'; // 違う（比較対象なし）
          } else {
            correct_key = (trialInfo.target_condition === "同じ") ? 'f' : 'j';
          }
          
          const responseKey = data.response;
          let isCorrect = false;
          if (responseKey !== null && responseKey.toLowerCase() === correct_key) {
            isCorrect = true;
          }
          
          let responseText = "無反応";
          if (responseKey === 'f') {
            responseText = "同じ (F)";
          } else if (responseKey === 'j') {
            responseText = "違う (J)";
          }

          // カスタムデータの記録 (1-Back用ラベル)
          data.nback_type = '1-back';
          data.trial_num = trialInfo.trial_index;
          data.stimulus_letter = trialInfo.letter;
          data.target_condition = trialInfo.target_condition;
          data.participant_response = responseText;
          data.correct = isCorrect;
        }
      };
      timeline.push(trial);
    });

    // --- 8. 休憩＆2-Back移行用の説明画面 ---
    const instructions2Back = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-left max-w-2xl mx-auto my-8">
          <div class="text-center mb-4">
            <span class="px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full uppercase tracking-wider">Break & Rule Change</span>
          </div>
          <h2 class="text-3xl font-bold text-center text-slate-800 mb-6">前半終了！ここでルールが変わります</h2>
          
          <div class="instruction-text space-y-4 text-slate-700">
            <p class="text-emerald-600 font-bold text-center text-lg">【前半お疲れ様でした】少し肩の力を抜いて、深呼吸をしてください。</p>
            <p>ここから始まる後半戦は、ルールの難易度が上がる<strong>「2-Backテスト」</strong>になります。</p>
            <p>今度は、表示されたアルファベットが<strong>【2つ前に表示された文字】と同じか違うか</strong>を判断してください。</p>
            
            <div class="bg-slate-50 p-4 rounded-lg border-l-4 border-amber-500 space-y-2 text-sm">
              <p class="font-bold text-slate-800">例（文字の並びが A → B → A → C と進んだ場合）</p>
              <ul class="list-disc pl-5 space-y-1 text-slate-600">
                <li>1文字目の <strong>A</strong> : 比較できないため「違う」です。</li>
                <li>2文字目の <strong>B</strong> : 比較できないため「違う」です。</li>
                <li>3文字目の <strong>A</strong> : 2つ前（1文字目）は「A」なので、答えは <span class="text-red-600 font-bold">「同じ」</span> です。</li>
                <li>4文字目の <strong>C</strong> : 2つ前（2文字目）は「B」なので、答えは <span class="text-blue-600 font-bold">「違う」</span> です。</li>
              </ul>
            </div>

            <p class="text-slate-600">操作方法（タップボタン・キーボード操作）は前半とまったく同じです。</p>
          </div>
          <p class="text-center text-red-500 font-semibold mb-4 text-sm">※ 2つ前の文字を常に頭の中でキープするのがコツです。準備ができたらスタートしましょう！</p>
        </div>
      `,
      choices: ['ルールを理解したので【後半】を開始する'],
      button_html: '<button class="custom-btn w-full bg-amber-600 hover:bg-amber-700 text-white">%choice%</button>'
    };
    timeline.push(instructions2Back);

    // --- 9. 2-Back課題ループの構築 ---
    stimulusSequence2Back.forEach((trialInfo) => {
      const trial = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function() {
          return `
            <div class="flex flex-col justify-between h-[80vh] py-8 select-none">
              <div class="text-center text-slate-400 font-medium text-sm md:text-base space-y-1">
                <div class="text-amber-500 font-bold">【後半：2つ前の文字と同じ？】</div>
                <div>同じなら「同じ」、違えば「違う」を選択してください。</div>
                <div class="hidden md:block">（パソコン：[F]キー ＝ 同じ / [J]キー ＝ 違う）</div>
              </div>
              
              <div id="stimulus-container" class="stimulus-display">
                ${trialInfo.letter}
              </div>
              
              <div class="flex justify-center gap-6 max-w-md mx-auto w-full px-4">
                <button id="btn-same" class="flex-1 py-4 bg-emerald-600 text-white font-bold text-xl rounded-2xl active:scale-95 shadow-md active:bg-emerald-700 transition-all">
                  同じ (F)
                </button>
                <button id="btn-diff" class="flex-1 py-4 bg-rose-600 text-white font-bold text-xl rounded-2xl active:scale-95 shadow-md active:bg-rose-700 transition-all">
                  違う (J)
                </button>
              </div>
            </div>
          `;
        },
        choices: ['f', 'j'],
        stimulus_duration: 500,
        trial_duration: 2000,
        response_ends_trial: false,
        on_load: function() {
          const btnSame = document.getElementById('btn-same');
          const btnDiff = document.getElementById('btn-diff');
          
          function handleButtonResponse(key) {
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
            if (key === 'f') {
              btnSame.classList.add('ring-4', 'ring-emerald-300', 'bg-emerald-700');
            } else if (key === 'j') {
              btnDiff.classList.add('ring-4', 'ring-rose-300', 'bg-rose-700');
            }
          }
          
          btnSame.addEventListener('click', () => handleButtonResponse('f'));
          btnDiff.addEventListener('click', () => handleButtonResponse('j'));
          btnSame.addEventListener('touchstart', (e) => { e.preventDefault(); handleButtonResponse('f'); });
          btnDiff.addEventListener('touchstart', (e) => { e.preventDefault(); handleButtonResponse('j'); });
        },
        on_finish: function(data) {
          let correct_key = null;
          // 2-Backでは最初の2試行は比較対象となる2つ前がないため必ず「違う（J）」
          if (trialInfo.trial_index <= 2) {
            correct_key = 'j';
          } else {
            correct_key = (trialInfo.target_condition === "同じ") ? 'f' : 'j';
          }
          
          const responseKey = data.response;
          let isCorrect = false;
          if (responseKey !== null && responseKey.toLowerCase() === correct_key) {
            isCorrect = true;
          }
          
          let responseText = "無反応";
          if (responseKey === 'f') {
            responseText = "同じ (F)";
          } else if (responseKey === 'j') {
            responseText = "違う (J)";
          }

          // カスタムデータの記録 (2-Back用ラベル)
          data.nback_type = '2-back';
          data.trial_num = trialInfo.trial_index;
          data.stimulus_letter = trialInfo.letter;
          data.target_condition = trialInfo.target_condition;
          data.participant_response = responseText;
          data.correct = isCorrect;
        }
      };
      timeline.push(trial);
    });

    // --- 10. 実験開始 ---
    jsPsych.run(timeline);

    // --- 11. 結果表示用のリッチなHTMLテーブルフィードバック関数 ---
    // 引数 isSentSuccess: 送信の成否状態（null: 未送信、true: 成功、false: 失敗）
    function displayFeedbackTable(isSentSuccess = null) {
      // 記録された全ての試行データ（1-Back、2-Back両方）を抽出
      const trialsData = jsPsych.data.get().filter({trial_type: 'html-keyboard-response'}).values();
      
      // 条件別の正答率・反応時間を計算
      const data1Back = trialsData.filter(d => d.nback_type === '1-back');
      const data2Back = trialsData.filter(d => d.nback_type === '2-back');

      // 1-Back統計
      const correct1Back = data1Back.filter(d => d.correct === true).length;
      const acc1Back = ((correct1Back / data1Back.length) * 100).toFixed(1);
      const validRt1Back = data1Back.filter(d => d.rt !== null);
      const avgRt1Back = validRt1Back.length > 0 
        ? (validRt1Back.reduce((sum, d) => sum + d.rt, 0) / validRt1Back.length).toFixed(1) 
        : "N/A";

      // 2-Back統計
      const correct2Back = data2Back.filter(d => d.correct === true).length;
      const acc2Back = ((correct2Back / data2Back.length) * 100).toFixed(1);
      const validRt2Back = data2Back.filter(d => d.rt !== null);
      const avgRt2Back = validRt2Back.length > 0 
        ? (validRt2Back.reduce((sum, d) => sum + d.rt, 0) / validRt2Back.length).toFixed(1) 
        : "N/A";

      // 全体正答率
      const totalCorrect = trialsData.filter(d => d.correct === true).length;
      const totalAccuracy = ((totalCorrect / trialsData.length) * 100).toFixed(1);

      // ユーザー情報の取得
      const pId = participantInfo.participant_id || "不明";
      const pAge = participantInfo.age || "不明";
      const pGender = participantInfo.gender || "不明";

      let tableRows = "";
      trialsData.forEach((d) => {
        const correctBadge = d.correct 
          ? `<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">正解</span>`
          : `<span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-800">不正解</span>`;
        
        const rtText = d.rt !== null ? `${Math.round(d.rt)} ms` : `<span class="text-slate-400">タイムアウト</span>`;
        const conditionBadge = d.target_condition === "同じ"
          ? `<span class="text-emerald-600 font-bold">同じ</span>`
          : `<span class="text-slate-500 font-medium">違う</span>`;

        const typeBadge = d.nback_type === '1-back'
          ? `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-indigo-100 text-indigo-800">1-Back</span>`
          : `<span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-100 text-amber-800">2-Back</span>`;

        tableRows += `
          <tr class="hover:bg-slate-50 border-b border-slate-100 transition-colors">
            <td class="px-4 py-4 text-center font-bold text-slate-500">${d.trial_num}</td>
            <td class="px-4 py-4 text-center">${typeBadge}</td>
            <td class="px-4 py-4 text-center font-black text-slate-800 text-lg">${d.stimulus_letter}</td>
            <td class="px-4 py-4 text-center">${conditionBadge}</td>
            <td class="px-4 py-4 text-center font-medium">${d.participant_response}</td>
            <td class="px-4 py-4 text-center">${correctBadge}</td>
            <td class="px-4 py-4 text-center text-slate-600">${rtText}</td>
          </tr>
        `;
      });

      // 自動送信ステータスに合わせた上部アラートの切り替え
      let transmissionAlert = "";
      if (isSentSuccess === true) {
        transmissionAlert = `
          <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex items-center gap-3 text-emerald-800">
            <svg class="h-6 w-6 text-emerald-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div>
              <p class="font-bold">実験終了。ご協力ありがとうございました。</p>
              <p class="text-xs text-emerald-600">測定データはサーバーへ正常に自動送信されました。</p>
            </div>
          </div>
        `;
      } else if (isSentSuccess === false) {
        transmissionAlert = `
          <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 flex items-center gap-3 text-rose-800">
            <svg class="h-6 w-6 text-rose-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div>
              <p class="font-bold">送信中にエラーが発生しました（またはオフライン状態です）</p>
              <p class="text-xs text-rose-600">データの自動保存に失敗しましたが、画面上の成績結果は手動で確認可能です。</p>
            </div>
          </div>
        `;
      }

      // フィードバック画面の構築
      const feedbackHTML = `
        <div class="min-h-screen bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
          <div class="max-w-4xl mx-auto space-y-8">
            
            <!-- 送信完了 / 失敗のアラート表示 -->
            ${transmissionAlert}

            <!-- タイトルと完了メッセージ -->
            <div class="text-center">
              <span class="px-3 py-1 bg-indigo-100 text-indigo-800 text-xs font-bold rounded-full uppercase tracking-wider">Experiment Completed</span>
              <h1 class="mt-3 text-4xl font-extrabold text-slate-900 tracking-tight sm:text-5xl">実験結果フィードバック</h1>
              <p class="mt-3 text-lg text-slate-500">今回のテストにおける正答率と反応時間の詳細分析データです。</p>
            </div>

            <!-- 被験者基本プロフィール -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
              <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                  <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">参加者情報</span>
                  <h2 class="text-xl font-bold text-slate-800">ID: ${pId}</h2>
                </div>
                <div class="flex gap-6 text-sm text-slate-600">
                  <div><strong>年齢:</strong> ${pAge} 歳</div>
                  <div><strong>性別:</strong> ${pGender}</div>
                </div>
              </div>
            </div>

            <!-- サマリーカード (1-Back と 2-Back の比較表示) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              
              <!-- 1-Backの結果 -->
              <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 border-l-8 border-l-indigo-500">
                <div class="flex justify-between items-center mb-4">
                  <span class="text-md font-bold text-slate-700">【前半】1-Back 課題データ</span>
                  <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-indigo-50 text-indigo-700">1-Back</span>
                </div>
                <div class="grid grid-cols-2 gap-4 text-center">
                  <div class="bg-slate-50 p-3 rounded-2xl">
                    <span class="text-xs text-slate-400">正答率</span>
                    <p class="text-3xl font-black text-indigo-600 mt-1">${acc1Back}%</p>
                    <span class="text-xs text-slate-500">正答数: ${correct1Back}/${data1Back.length}</span>
                  </div>
                  <div class="bg-slate-50 p-3 rounded-2xl">
                    <span class="text-xs text-slate-400">平均反応時間</span>
                    <p class="text-3xl font-black text-slate-700 mt-1">${avgRt1Back}<span class="text-sm font-bold">ms</span></p>
                    <span class="text-xs text-slate-500">※無反応を除く</span>
                  </div>
                </div>
              </div>

              <!-- 2-Backの結果 -->
              <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 border-l-8 border-l-amber-500">
                <div class="flex justify-between items-center mb-4">
                  <span class="text-md font-bold text-slate-700">【後半】2-Back 課題データ</span>
                  <span class="px-2.5 py-1 text-xs font-bold rounded-lg bg-amber-50 text-amber-700">2-Back</span>
                </div>
                <div class="grid grid-cols-2 gap-4 text-center">
                  <div class="bg-slate-50 p-3 rounded-2xl">
                    <span class="text-xs text-slate-400">正答率</span>
                    <p class="text-3xl font-black text-amber-600 mt-1">${acc2Back}%</p>
                    <span class="text-xs text-slate-500">正答数: ${correct2Back}/${data2Back.length}</span>
                  </div>
                  <div class="bg-slate-50 p-3 rounded-2xl">
                    <span class="text-xs text-slate-400">平均反応時間</span>
                    <p class="text-3xl font-black text-slate-700 mt-1">${avgRt2Back}<span class="text-sm font-bold">ms</span></p>
                    <span class="text-xs text-slate-500">※無反応を除く</span>
                  </div>
                </div>
              </div>

            </div>

            <!-- 反応データテーブル -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
              <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                  <h3 class="text-lg font-bold leading-6 text-slate-900">統合試行データの詳細 (全40試行)</h3>
                  <p class="mt-1 text-sm text-slate-500">1-Backおよび2-Back課題全体のすべての試行反応ログです。</p>
                </div>
                <div class="px-4 py-2 bg-slate-100 rounded-xl text-xs font-bold text-slate-600">
                  全体正答率: <span class="text-indigo-600 text-sm font-black">${totalAccuracy}%</span>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                  <thead class="bg-slate-50">
                    <tr>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">試行番号</th>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">課題条件 (Condition)</th>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">提示文字</th>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">ターゲット条件</th>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">あなたの回答</th>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">正誤 (Correct)</th>
                      <th scope="col" class="px-4 py-3.5 text-center text-xs font-bold text-slate-500 uppercase tracking-wider">反応時間 (RT)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 bg-white">
                    ${tableRows}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
      `;

      // jsPsych表示用DOMをオーバーライドして結果を挿入
      document.getElementById('jspsych-target').innerHTML = feedbackHTML;
    }
  </script>
</body>
</html>
